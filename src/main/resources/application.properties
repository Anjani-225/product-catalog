spring.application.name=product-catalog
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_catalog}
spring.datasource.username=${DB_USERNAME:catalog}
spring.datasource.password=${DB_PASSWORD:catalog}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
logging.level.root=INFO
logging.level.com.example.productcatalog=INFO
