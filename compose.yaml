services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: product_catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog-local-only
    ports:
      - "5432:5432"
    volumes:
      - product-catalog-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d product_catalog"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/product_catalog
      DB_USERNAME: catalog
      DB_PASSWORD: catalog-local-only
      DB_POOL_SIZE: 20
      DB_POOL_MIN_IDLE: 5
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  product-catalog-postgres:
